<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KING PETER PRO - MATCHES OVER UNDER</title>

.big{font-size:44px;font-weight:900;color:#0a8a00;margin:12px 0}
.row{display:flex;gap:8px;margin-top:10px}
.box{flex:1;background:#111;color:white;border-radius:10px;padding:12px}
.box b{color:#FFD700;display:block;font-size:22px;margin-top:4px}
.matchbox{background:#fff8d0;border:2px dashed #c9a900;border-radius:10px;padding:12px;margin-top:12px;text-align:left;font-size:15px}

<div class="box">UNDER (0-4)<b id="under">0</b></div>
</div>

<div class="box">ODD<b id="odd">0</b></div>

<div class="matchbox">
<b>🔁 DIGIT MATCHES:</b><br>
<div id="matches" style="margin-top:6px">Type number to see matches</div>
</div>
<div class="matchbox">
<b>📊 OVER/UNDER STATS:</b>
<div id="stats" style="margin-top:6px">-</div>
</div>
</div>

document.getElementById('odd').innerText=odd;
