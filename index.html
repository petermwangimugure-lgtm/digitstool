<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KING PETER V2 FIXED</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:12px;text-align:center}
.top{background:black;color:#FFD700;padding:16px;border-radius:12px;font-size:20px;font-weight:bold}
.card{background:white;border-radius:14px;padding:16px;margin-top:10px;border:3px solid #FFD700}
input{width:90%;padding:16px;font-size:22px;border:3px solid #FFD700;border-radius:10px;text-align:center;font-weight:bold}
.btn{background:#0a8a00;color:white;padding:14px 20px;border:none;border-radius:10px;font-size:20px;font-weight:bold;width:92%;margin-top:10px}
.big{font-size:38px;font-weight:900;color:#0a8a00;margin:10px 0}
.row{display:flex;gap:6px;margin-top:8px}
.box{flex:1;background:#111;color:white;border-radius:10px;padding:10px;font-size:12px}
.box b{color:#FFD700;display:block;font-size:18px;margin-top:3px}
.matchbox{background:#fff8d0;border:2px dashed #c9a900;border-radius:10px;padding:10px;margin-top:10px;text-align:left}
</style>
</head>
<body>
<div class="top">KING PETER<br>V2 - MATCHES + OVER/UNDER</div>
<div class="card">
<input id="n" placeholder="Enter e.g. 112233" inputmode="numeric" type="text">
<button class="btn" onclick="calc()">✅ CALCULATE NOW</button>
<div class="big" id="sum">Sum: 0</div>
<div class="row">
<div class="box">OVER (5-9)<b id="over">0</b></div>
<div class="box">UNDER (0-4)<b id="under">0</b></div>
</div>
<div class="row">
<div class="box">EVEN<b id="even">0</b></div>
<div class="box">ODD<b id="odd">0</b></div>
</div>
<div class="matchbox"><b>🔁 DIGIT MATCHES:</b><br><div id="matches">Press CALCULATE</div></div>
<div class="matchbox"><b>📊 OVER/UNDER STATS:</b><div id="stats">-</div></div>
</div>
<script>
function calc(){
var input=document.getElementById('n');
var v=input.value.toString().replace(/[^0-9]/g,'');
if(!v){alert('Type number first!');return;}
var d=v.split('').map(function(x){return parseInt(x);});
var sum=0;for(var i=0;i<d.length;i++)sum+=d[i];
var over=0;for(var i=0;i<d.length;i++)if(d[i]>=5)over++;
var under=d.length-over;
var even=0;for(var i=0;i<d.length;i++)if(d[i]%2==0)even++;
var odd=d.length-even;
document.getElementById('sum').innerText='Sum: '+sum;
document.getElementById('over').innerText=over;
document.getElementById('under').innerText=under;
document.getElementById('even').innerText=even;
document.getElementById('odd').innerText=odd;
var f={};for(var i=0;i<d.length;i++){var k=d[i];f[k]=(f[k]||0)+1;}
var html='';
for(var k=0;k<=9;k++){if(f[k]){if(f[k]>1){html+='<span style="color:red;font-weight:bold">'+k+' x'+f[k]+' MATCH! </span> ';}else{html+=k+' x'+f[k]+' ';}}}
document.getElementById('matches').innerHTML=html||'No matches';
document.getElementById('stats').innerHTML='Total: <b>'+d.length+'</b> digits<br>Sum is <b>'+(sum>=20?'OVER 20':'UNDER 20')+'</b><br>Balance: <b>'+(over>under?'More OVER':over<under?'More UNDER':'Equal')+'</b>';
}
// also auto calc when typing
document.getElementById('n').addEventListener('input',calc);
document.getElementById('n').addEventListener('keyup',calc);
</script>
</body>
</html>
