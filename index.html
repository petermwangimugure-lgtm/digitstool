<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>King Peter Digit Tools</title></head>
<body style="background:white;color:black;font-family:Arial;padding:20px;text-align:center">
<h1 style="color:gold;background:black;padding:15px;border-radius:10px">KING PETER DIGIT TOOLS</h1>
<h2>Digit Calculator Pro</h2>
<input id="n" style="padding:15px;font-size:22px;width:90%;border:3px solid gold;text-align:center" placeholder="Enter Number 12345" oninput="calc()">
<h1 id="sum" style="font-size:40px;margin-top:20px;color:green">Sum: 0</h1>
<p id="more"></p>
<button onclick="document.getElementById('n').value='';calc()" style="padding:12px 20px;background:black;color:gold;font-weight:bold">CLEAR</button>
<script>
function calc(){
let v=document.getElementById('n').value.replace(/[^0-9]/g,'');
if(!v){document.getElementById('sum').innerText='Sum: 0';document.getElementById('more').innerText='';return}
let d=v.split('').map(Number);
let s=d.reduce((a,b)=>a+b,0);
let rev=v.split('').reverse().join('');
document.getElementById('sum').innerText='Sum: '+s;
document.getElementById('more').innerText='Digits: '+d.length+' | Reverse: '+rev+' | Product: '+(v.includes('0')?0:d.reduce((a,b)=>a*b,1));
}
</script>
</body></html>
