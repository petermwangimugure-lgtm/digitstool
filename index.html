<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V10s</title><style>body{background:#000;color:#fff;font-family:Arial;padding:10px;text-align:center}.card{background:#fff;color:#000;border-radius:12px;padding:15px;margin-top:10px;border:3px solid gold} input{width:90%;padding:12px;border:3px solid gold;border-radius:10px;text-align:center;font-weight:bold}.btn{width:92%;padding:12px;border:none;border-radius:10px;font-weight:900;margin-top:8px}.btn-gold{background:gold;color:#000}.freq{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0}.f{padding:6px;background:#f9f9f9;border:2px solid #ddd;border-radius:6px;font-weight:900;font-size:12px}.f b{display:block;color:green}.f.hot{background:gold}.box{flex:1;background:#111;color:#fff;padding:6px;border-radius:6px;font-size:9px;text-align:center}.box b{color:gold;display:block;font-size:14px} #tool{display:none}</style></head><body>
<div id="login"><div style="background:gold;color:#000;padding:12px;border-radius:12px;font-weight:900">👑 KING PETER V10s - 1991</div><div class="card"><h3>🔐 PRIVATE</h3><input id="p" type="password" placeholder="Enter 1991"><button class="btn btn-gold" onclick="if(document.getElementById('p').value.trim()=='1991'){login.style.display='none';tool.style.display='block'}else alert('Wrong! Type 1991')">UNLOCK</button></div></div>
<div id="tool"><div style="background:gold;color:#000;padding:10px;border-radius:10px;font-weight:900">⚡ V10s % TOOL - V10(1s)</div><div class="card"><input id="n" placeholder="Paste digits like 012345..."><button class="btn btn-gold" onclick="calc()" style="background:#0a8a00;color:#fff">% CALCULATE</button><div id="sum" style="font-weight:900;color:green;margin:6px 0"></div><div style="background:#00ff88;color:#000;padding:8px;border-radius:8px;font-weight:900;margin:6px 0" id="match">Next Match: -</div><div class="freq" id="freq"></div><div style="display:flex;gap:4px;margin-top:6px"><div class="box">LAST<b id="last">-</b></div><div class="box">NO-MATCH<b id="nm">0</b></div><div class="box">OVER<b id="over">0%</b></div><div class="box">UNDER<b id="under">0%</b></div></div><div id="trade" style="background:#fff8d0;border:2px dashed gold;padding:6px;margin-top:6px;font-size:11px;text-align:left"></div><button class="btn" style="background:#000;color:#fff" onclick="tool.style.display='none';login.style.display='block'">LOCK</button></div></div>
<script>function calc(){let r=document.getElementById('n').value.replace(/[^0-9]/g,'');if(r.length<5)return;let v=r.slice(-15);let d=v.split('').map(x=>+x);let sum=d.reduce((a,b)=>a+b,0);let last=d[d.length-1];let nm=0;for(let i=d.length-1;i>0;i--){if(d[i]!=d[i-1])nm++;else break}let over=d.filter(x=>x>=5).length;let under=d.length-over;document.getElementById('sum').innerText='Sum '+sum+' | 15 digits | Last '+last+' | NoMatch '+nm;document.getElementById('last').innerText=last;document.getElementById('nm').innerText=nm;document.getElementById('over').innerText=Math.round(over/d.length*100)+'%';document.getElementById('under').innerText=Math.round(under/d.length*100)+'%';let freq=new Array(10).fill(0);d.forEach(n=>freq[n]++);let max=Math.max(...freq);let h='';for(let i=0;i<10;i++){let pct=Math.round(freq[i]/d.length*100);h+=`<div class="f ${freq[i]==max?'hot':''}">${i}<b>${freq[i]}</b>${pct}%</div>`}document.getElementById('freq').innerHTML=h;let sorted=[];for(let i=0;i<10;i++)sorted.push({d:i,c:freq[i],p:Math.round(freq[i]/d.length*100)});sorted.sort((a,b)=>b.c-a.c);let matchPct=Math.min(20+nm*12,95);let mBox=document.getElementById('match');if(nm>=6){mBox.style.background='red';mBox.style.color='#fff';mBox.innerHTML=`🚨 MATCH DUE ${matchPct}%! NEXT=${last} | TRADE MATCHES ${last} NOW!`}else{mBox.style.background='#00ff88';mBox.style.color='#000';mBox.innerHTML=`HOT ${sorted[0].d}=${sorted[0].p}% | Next Match ${last}=${matchPct}% - Wait 6+`}document.getElementById('trade').innerHTML=`TOP: ${sorted[0].d} ${sorted[0].p}% | ${sorted[1].d} ${sorted[1].p}% | ${sorted[2].d} ${sorted[2].p}%<br>2 Nums: ${sorted[0].d},${sorted[1].d} | 3 Nums: +${sorted[2].d}<br>Matches: If NoMatch 6+ trade ${last} (${matchPct}%)`}</script></body></html>
