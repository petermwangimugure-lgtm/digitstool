<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KING PETER V4 - HOT DIGIT PREDICTOR</title>
<style>
body{font-family:Arial;background:#0a0a0a;margin:0;padding:8px;color:white;text-align:center}
.top{background:linear-gradient(90deg,#FFD700,#FFA500);color:black;padding:12px;border-radius:12px;font-weight:900;font-size:16px}
.card{background:white;color:black;border-radius:12px;padding:10px;margin-top:8px;border:3px solid #FFD700;text-align:left}
input{width:94%;padding:12px;font-size:20px;border:3px solid #FFD700;border-radius:10px;text-align:center;font-weight:bold;display:block;margin:auto}
.btn{width:95%;padding:11px;border:none;border-radius:8px;font-size:15px;font-weight:bold;margin-top:6px;display:block;margin-left:auto;margin-right:auto}
.btn-green{background:#0a8a00;color:white}
.btn-black{background:black;color:#FFD700}
.big{font-size:32px;font-weight:900;text-align:center;color:#0a8a00;margin:6px 0}
.row{display:flex;gap:5px;margin-top:5px}
.box{flex:1;background:#111;color:white;border-radius:8px;padding:6px;text-align:center;font-size:10px}
.box b{color:#FFD700;display:block;font-size:15px}
.hot{background:linear-gradient(90deg,#ff0000,#ff6600);color:white;padding:10px;border-radius:10px;text-align:center;margin-top:8px;font-weight:bold;font-size:14px}
.hot b{font-size:22px;display:block;color:yellow}
.matchbox{background:#fff8d0;border:2px dashed #c9a900;border-radius:8px;padding:7px;margin-top:6px;font-size:12px;color:black}
</style>
</head>
<body>
<div class="top">👑 KING PETER V4<br>HOT DIGIT + MATCHES PREDICTOR</div>

<div class="card">
<select id="vol" style="width:95%;padding:8px;border:2px solid gold;border-radius:8px;font-weight:bold;display:block;margin:0 auto 6px auto">
<option>Volatility 10 Index</option>
<option>Volatility 25 Index</option>
<option selected>Volatility 100 (1s) - BEST FOR MATCHES</option>
<option>Volatility 10 (1s)</option>
<option>Volatility 50 (1s)</option>
<option>Volatility 75 (1s)</option>
</select>

<input id="n" placeholder="Paste last 20 digits e.g. 1122334455" type="text" inputmode="numeric">
<button class="btn btn-green" onclick="calc()">🔥 ANALYZE & PREDICT</button>
<button class="btn btn-black" onclick="clearAll()">🗑️ CLEAR</button>

<div class="big" id="sum">Sum: 0</div>

<div class="row">
<div class="box">OVER 5-9<b id="over">0</b></div>
<div class="box">UNDER 0-4<b id="under">0</b></div>
<div class="box">LAST<b id="last">-</b></div>
<div class="box">EVEN<b id="even">0</b></div>
</div>

<div id="hotbox" class="hot" style="display:none">
<span id="hottext">HOT DIGIT</span>
<b id="hotdigit">-</b>
<span id="hotreason">-</span>
</div>

<div class="matchbox"><b>🔁 ALL DIGIT COUNTS:</b><div id="matches">-</div></div>
<div class="matchbox"><b>📊 STRATEGY FOR MATCHES:</b><div id="stats">-</div></div>
<div class="matchbox"><b>🎯 WHAT TO TRADE NOW:</b><div id="trade">-</div></div>
</div>

<script>
function calc(){
let v=document.getElementById('n').value.replace(/[^0-9]/g,'');
if(v.length<3){alert('Enter at least 3 digits! Example: 11223');return;}
let d=v.split('').map(x=>parseInt(x));
let sum=d.reduce((a,b)=>a+b,0);
let over=d.filter(x=>x>=5).length;
let under=d.length-over;
let even=d.filter(x=>x%2==0).length;
let last=d[d.length-1];

document.getElementById('sum').innerText='Sum: '+sum;
document.getElementById('over').innerText=over;
document.getElementById('under').innerText=under;
document.getElementById('even').innerText=even;
document.getElementById('last').innerText=last;

// count
let f={};d.forEach(k=>f[k]=(f[k]||0)+1);
let sorted=Object.keys(f).map(k=>({digit:parseInt(k),count:f[k]})).sort((a,b)=>b.count-a.count);

let html='';
sorted.forEach(o=>{html+=(o.count>1?'<span style="color:red;font-weight:900">'+o.digit+' x'+o.count+' MATCH! </span>':'<span>'+o.digit+' x'+o.count+' </span>');});
for(let k=0;k<=9;k++){if(!f[k]){html+='<span style="color:gray">'+k+' x0 </span>';}}
document.getElementById('matches').innerHTML=html;

// HOT DIGIT
let hot=sorted[0];
let cold=sorted[sorted.length-1];
document.getElementById('hotbox').style.display='block';
document.getElementById('hotdigit').innerText=hot.digit+' (x'+hot.count+')';
document.getElementById('hottext').innerText='🔥 HOT DIGIT FOR MATCHES:';
document.getElementById('hotreason').innerText=hot.digit+' appeared '+hot.count+' times in last '+d.length+' ticks!';

// strategy
let noMatchCount=0;
for(let i=d.length-1;i>0;i--){if(d[i]!=d[i-1])noMatchCount++;else break;}

let strat='No match for <b>'+noMatchCount+' ticks</b><br>';
if(noMatchCount>=6){strat+='<span style="color:red">⚠️ MATCH is DUE! Trade MATCHES!</span><br>';}
else if(noMatchCount<=1){strat+='<span style="color:orange">⚠️ Just had match, next is likely DIFFERS!</span><br>';}
else{strat+='Waiting...<br>';}
strat+='Most frequent: <b>'+hot.digit+'</b> | Least: <b>'+cold.digit+'</b>';
document.getElementById('stats').innerHTML=strat;

// what to trade
let trade='';
if(noMatchCount>=5){trade='<b style="color:green">TRADE: MATCHES on '+hot.digit+' (Hot)</b><br>Reason: No match for '+noMatchCount+' ticks, match is due!';}
else if(noMatchCount==0){trade='<b style="color:blue">TRADE: DIFFERS</b><br>Reason: Just had match ('+last+'), next often differs!';}
else{trade='<b>TRADE: MATCHES on '+hot.digit+' or DIFFERS if you want safe</b><br>Last digit was '+last+'. If you think '+last+' will repeat, pick MATCHES on '+last+'.';}
if(over>under+2)trade+='<br>Also: <b>UNDER is coming (OVER too many)</b>';
if(under>over+2)trade+='<br>Also: <b>OVER is coming (UNDER too many)</b>';
document.getElementById('trade').innerHTML=trade;
}
function clearAll(){
document.getElementById('n').value='';
document.getElementById('hotbox').style.display='none';
document.getElementById('sum').innerText='Sum: 0';
document.getElementById('over').innerText='0';document.getElementById('under').innerText='0';
document.getElementById('even').innerText='0';document.getElementById('last').innerText='-';
document.getElementById('matches').innerText='-';document.getElementById('stats').innerText='-';document.getElementById('trade').innerText='-';
}
</script>
</body>
</html>
